name: Build & Release

# Pushe einen Tag wie "v1.0.1", um automatisch zu bauen und ein Release
# mit der TOR-ChanceModifier.dll als Asset zu erstellen.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # TOR-Version, gegen die gebaut wird. Muss zu deinem lokalen Stand passen.
  TOR_VERSION: 'v4.8.0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Version aus Tag ermitteln
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # vX.Y.Z (stable) oder vX.Y.Z.W (Testversion, W = Testversionsnummer).
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' ist keine gueltige Version (erwartet vX.Y.Z oder vX.Y.Z.W)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: VersionString in Plugin.cs auf Tag setzen
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i -E "s/(VersionString = \")[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(\")/\1${VERSION}\3/" Plugin.cs
          echo "Gesetzt auf:"; grep VersionString Plugin.cs

      - name: TheOtherRoles.dll aus TOR-Release laden
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$TOR_VERSION" \
            --repo TheOtherRolesAU/TheOtherRoles \
            --pattern 'TheOtherRoles.dll' \
            --dir lib

      - name: Build
        run: dotnet build -c Release -p:TheOtherRolesDll=lib/TheOtherRoles.dll

      - name: Release erstellen + DLL anhaengen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DLL="bin/Release/net6.0/TOR-ChanceModifier.dll"
          # 4-stellige Tags (vX.Y.Z.W) sind Testversionen -> als GitHub-Prerelease markieren, damit
          # "latest" auf dem stabilen vX.Y.Z bleibt.
          PRERELEASE=""
          if echo "${GITHUB_REF_NAME#v}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" "$DLL" \
            --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE \
          || gh release upload "$GITHUB_REF_NAME" "$DLL" --clobber
